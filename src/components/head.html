<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="robots" content="{{ROBOTS}}">
{{CANONICAL_TAG}}

<!-- Open Graph -->
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
{{OG_URL_META}}
<meta property="og:type" content="website">{{OG_IMAGE_META}}

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<link rel="alternate icon" href="/images/favicon.svg">

<link rel="stylesheet" href="/styles.css">

<!-- Anti-FOUC: read theme from localStorage before first paint -->
<script>(function(){var t=localStorage.getItem('dc-theme')||'light';document.documentElement.dataset.theme=t;})()</script>

<!-- Google Analytics (deferred to run after page paint) -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FQTN7YP548');
  window.addEventListener('load', function() {
    setTimeout(function() {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-FQTN7YP548';
      document.head.appendChild(s);
    }, 2500);
  });
</script>

{{SCHEMA_JSONLD}}

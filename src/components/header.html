<header class="site-header">
  <div class="container site-header__inner">

    <a href="/" class="site-header__wordmark" aria-label="Dave Cummings, home">
      <span class="wm-dave">Dave</span><span class="wm-cummings">Cummings</span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <a href="/" class="site-nav__link">Home</a>
      <a href="/services/" class="site-nav__link">Services</a>
      <a href="/about/" class="site-nav__link">About</a>
      <a href="/contact/" class="site-nav__link">Contact</a>
    </nav>

    <div class="site-header__actions">
      <button
        class="theme-toggle"
        id="theme-toggle"
        aria-label="Toggle dark mode"
        aria-pressed="false"
      >
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <a href="/contact/" class="btn btn-outline btn-sm site-header__cta">Let's chat</a>
      <button
        class="hamburger-toggle"
        id="hamburger-toggle"
        aria-label="Menu"
        aria-expanded="false"
        aria-controls="mobile-menu"
        data-open="false"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <line class="hamburger-toggle__line hamburger-toggle__line--1" x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line class="hamburger-toggle__line hamburger-toggle__line--2" x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line class="hamburger-toggle__line hamburger-toggle__line--3" x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

  </div>

  <div id="mobile-menu" class="mobile-menu" data-open="false" aria-hidden="true">
    <nav aria-label="Mobile primary">
      <a href="/" class="mobile-menu__link">Home</a>
      <a href="/services/" class="mobile-menu__link">Services</a>
      <a href="/about/" class="mobile-menu__link">About</a>
      <a href="/contact/" class="mobile-menu__link">Contact</a>
    </nav>
    <a href="/contact/" class="btn btn-primary mobile-menu__cta">Let's chat</a>
  </div>
</header>

<script>
  (function () {
    var btn = document.getElementById('theme-toggle');

    function sync() {
      var dark = document.documentElement.dataset.theme === 'dark';
      btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
    }

    sync();

    btn.addEventListener('click', function () {
      var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('dc-theme', next);
      sync();
    });
  })();

  (function () {
    var toggle = document.getElementById('hamburger-toggle');
    var menu = document.getElementById('mobile-menu');
    if (!toggle || !menu) return;

    var links = menu.querySelectorAll('.mobile-menu__link');

    function isOpen() {
      return toggle.dataset.open === 'true';
    }

    function openMenu() {
      toggle.dataset.open = 'true';
      menu.dataset.open = 'true';
      toggle.setAttribute('aria-expanded', 'true');
      menu.setAttribute('aria-hidden', 'false');
      window.setTimeout(function () {
        if (links[0]) links[0].focus();
      }, 200);
    }

    function closeMenu(returnFocus) {
      toggle.dataset.open = 'false';
      menu.dataset.open = 'false';
      toggle.setAttribute('aria-expanded', 'false');
      menu.setAttribute('aria-hidden', 'true');
      if (returnFocus) toggle.focus();
    }

    toggle.addEventListener('click', function () {
      if (isOpen()) {
        closeMenu(true);
      } else {
        openMenu();
      }
    });

    links.forEach(function (link) {
      link.addEventListener('click', function () {
        closeMenu(false);
      });
    });

    document.addEventListener('click', function (e) {
      if (!isOpen()) return;
      if (menu.contains(e.target) || toggle.contains(e.target)) return;
      closeMenu(false);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && isOpen()) {
        closeMenu(true);
      }
    });

    var aboveBreakpoint = window.matchMedia('(min-width: 640px)');
    function handleBreakpointChange(e) {
      if (e.matches && isOpen()) {
        closeMenu(false);
      }
    }
    if (aboveBreakpoint.addEventListener) {
      aboveBreakpoint.addEventListener('change', handleBreakpointChange);
    } else if (aboveBreakpoint.addListener) {
      aboveBreakpoint.addListener(handleBreakpointChange);
    }
  })();
</script>
